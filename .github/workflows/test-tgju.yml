name: Test TGJU

on:
  workflow_dispatch:

jobs:
  test-tgju:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Run TGJU Test
        run: python test_tgju.py
